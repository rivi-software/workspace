# The phone app (mobile/) and the push relay (relay/) are packages of their own: their scripts, tools and tests.
packages:
  - mobile
  - relay

# Dependency build scripts are blocked unless listed here (pnpm 12).
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  "@tailwindcss/oxide": true
  "@typescript/native-preview": true
  # lefthook's postinstall runs `lefthook install`, which writes the pre-commit hook of lefthook.yml into .git/hooks
  # (it skips that where CI is set).
  lefthook: true
  # core-js only prints a funding message.
  core-js: false
  core-js-pure: false
  # posthog-cli (a dependency of @posthog/rollup-plugin, the source-map upload) downloads its binary on first run,
  # not at install.
  "@posthog/cli": false

# No transitive dependencies from git or tarball URLs.
blockExoticSubdeps: true

# A version published less than seven days ago is not installed: most malicious releases are found and pulled within
# days.
minimumReleaseAge: 10080
# Versions the lockfile already held when the rule came in (the production group of #29), each within seven days of
# its release then. Remove them after 2026-12-01, when the youngest is a week old.
minimumReleaseAgeExclude:
  - "@ai-sdk/anthropic@4.0.108"
  - "@ai-sdk/gateway@4.0.154"
  - "@ai-sdk/provider-utils@5.0.83"
  - "@posthog/types@1.427.2"
  - "ai@7.0.181"

# A version that was published with weaker evidence of who published it than an earlier one of the same package
# (provenance, then trusted publishing, gone) is refused: that is what a stolen token looks like.
trustPolicy: no-downgrade

overrides:
  sharp: 0.35.5
  # drizzle-kit carries esbuild copies with dev-server advisories (GHSA-67mh-4wv8-2f99 via @esbuild-kit/core-utils,
  # GHSA-g7r4-m6w7-qqqr via tsx 4.21). Remove both once drizzle-kit ships with patched versions.
  "@esbuild-kit/core-utils>esbuild": ^0.28.1
  drizzle-kit>tsx: ^4.23.15

# tsx registers its loader with module.register(), which Node 26 reports as deprecated on every run.
nodeOptions: --disable-warning=DEP0205
