# Every pull request and every push to main: the static checks, the tests, the build and what it holds, then the smoke
# test against the build served by `wrangler dev --local`. Nothing here reaches Cloudflare; deploys are
# .github/workflows/deploy.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from `packageManager` in package.json, Node's from .node-version.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Local settings: example.com mailboxes, the mock Assistant, PostHog off.
      - run: cp .dev.vars.example .dev.vars

      # The typecheck, Oxlint, the check that migrations/ matches app/db/schema.ts and that no recorded migration
      # changed (migrations/JOURNAL.json), and Oxfmt.
      - run: pnpm run verify:static

      # Vitest inside workerd, with the migrations applied to a fresh database.
      - run: pnpm run test

      # The production build, a dry-run deploy of it, and what it must not carry (workers-bundle-check.config.ts).
      - run: pnpm run build && pnpm run build:check

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cp .dev.vars.example .dev.vars

      # The build writes dist/server/wrangler.json and points Wrangler at it (.wrangler/deploy), so the
      # `wrangler dev` below serves the built Worker, not the sources.
      - run: pnpm run build

      # The local D1 migrations and the seed (admin@example.com / password), which the smoke signs in with.
      - run: pnpm run setup

      # Wrangler reads .dev.vars beside the config it serves.
      - run: cp .dev.vars dist/server/.dev.vars

      - name: Start the Worker
        run: |
          nohup pnpm exec wrangler dev --local --port 8788 > wrangler-dev.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8788/api/health > /dev/null 2>&1; then
              echo "The Worker answers on :8788"
              exit 0
            fi
            sleep 1
          done
          echo "The Worker did not answer on :8788 within 90 seconds"
          cat wrangler-dev.log
          exit 1

      # Sign-in, an inbound message, the inbox, a reply, Sent, search, Drive, a link outside the workspace, Better
      # Auth's session, the Assistant on the mock model, Calendar, Tasks and the password reset pages.
      - run: BASE_URL=http://localhost:8788 pnpm run smoke

      - name: Worker log
        if: failure()
        run: cat wrangler-dev.log
