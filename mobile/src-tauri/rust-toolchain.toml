# The Rust that builds the app, here and in CI (.github/workflows/mobile.yml at the root); rustup
# installs it, with the iPhone, iOS Simulator and Android targets, on the first `cargo` run.
[toolchain]
channel = "1.98.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = [
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "i686-linux-android",
  "x86_64-linux-android",
]
